<div class="col-md-4" id="usage_type_wrapper" style="display:none;">
    <label for="{{ form.usage_type.id_for_label }}" class="form-label">الجهة</label>
    {{ form.usage_type }}
</div>

<div class="col-md-4" id="driver_wrapper" style="display:none;">
    <label for="{{ form.driver.id_for_label }}" class="form-label">اسم السائق</label>
    {{ form.driver }}
</div>

<div class="col-md-4" id="vehicle_type_wrapper" style="display:none;">
    <label for="{{ form.vehicle_type.id_for_label }}" class="form-label">نوع السيارة</label>
    {{ form.vehicle_type }}
</div>

<div class="col-md-4" id="meter_reading_wrapper" style="display:none;">
    <label for="{{ form.meter_reading.id_for_label }}" class="form-label">القراءة</label>
    {{ form.meter_reading }}
    {% if form.meter_reading.errors %}
        <div class="text-danger">{{ form.meter_reading.errors }}</div>
    {% endif %}
</div>

<div class="col-md-12" id="notes_wrapper" style="display:none;">
    <label for="{{ form.notes.id_for_label }}" class="form-label">ملاحظات</label>
    {{ form.notes }}
</div>

<div id="motor_fields" class="row g-3" style="display:none;">
    <div class="col-md-3">
        <label for="{{ form.start_time.id_for_label }}" class="form-label">ساعة التشغيل</label>
        {{ form.start_time }}
    </div>

    <div class="col-md-3">
        <label for="{{ form.end_time.id_for_label }}" class="form-label">ساعة الإيقاف</label>
        {{ form.end_time }}
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const typeField = document.getElementById('id_type');
    const usageField = document.getElementById('id_usage_type');

    const usageWrapper = document.getElementById('usage_type_wrapper');
    const driverWrapper = document.getElementById('driver_wrapper');
    const vehicleTypeWrapper = document.getElementById('vehicle_type_wrapper');
    const notesWrapper = document.getElementById('notes_wrapper');
    const motorFields = document.getElementById('motor_fields');
    const meterReadingWrapper = document.getElementById('meter_reading_wrapper');

    function toggleFields() {
        const type = typeField ? typeField.value : '';
        const usage = usageField ? usageField.value : '';

        if (usageWrapper) usageWrapper.style.display = 'none';
        if (driverWrapper) driverWrapper.style.display = 'none';
        if (vehicleTypeWrapper) vehicleTypeWrapper.style.display = 'none';
        if (notesWrapper) notesWrapper.style.display = 'none';
        if (motorFields) motorFields.style.display = 'none';
        if (meterReadingWrapper) meterReadingWrapper.style.display = 'none';

        if (type === 'out') {
            if (usageWrapper) usageWrapper.style.display = 'block';
            if (notesWrapper) notesWrapper.style.display = 'block';

            if (usage === 'vehicle') {
                if (driverWrapper) driverWrapper.style.display = 'block';
                if (vehicleTypeWrapper) vehicleTypeWrapper.style.display = 'block';
                if (meterReadingWrapper) meterReadingWrapper.style.display = 'block';
            } else if (usage === 'motor') {
                if (motorFields) motorFields.style.display = 'flex';
                if (meterReadingWrapper) meterReadingWrapper.style.display = 'block';
            }
        }
    }

    if (typeField) {
        typeField.addEventListener('change', toggleFields);
    }

    if (usageField) {
        usageField.addEventListener('change', toggleFields);
    }

    toggleFields();
});
</script>
